version: "3.7"
services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - /home/ubuntu/data/homarr/:/app/data
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_PASS}
networks:
  default:
      name: public_facing
      external: true
